[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirty-fin-reports"
version = "0.0.2"
description = "Trading-bot financial + ML-health reporting engine (phase 1: simple metrics)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "plotly>=5.18.0",
    "kaleido==0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "tabulate>=0.9.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"